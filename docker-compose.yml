version: '3.9'

services:
  app:
    image: codelabz:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production 
    container_name: codelabz-production
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - codelabz-network
    labels:
      - "com.codelabz.description=Codelabz Production Application"
      - "com.codelabz.version=1.0"

networks:
  codelabz-network:
    driver: bridge
