services:
  emulators:
    build:
      context: .
      dockerfile: Dockerfile.emulators
    working_dir: /app
    volumes:
      - .:/app
      # keep the image's functions deps; the bind mount above would hide them
      - /app/functions/node_modules
    ports:
      - "4000:4000"
      - "9099:9099"
      - "8080:8080"
      - "9000:9000"
      - "9199:9199"
      - "5001:5001"
      - "8085:8085"
    environment:
      FIREBASE_PROJECT_ID: demo-codelabz
    command: >
      firebase emulators:start
      --import=./testdata
      --project demo-codelabz
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4400/emulators || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s
    restart: on-failure

  app:
    build:
      context: .
      target: dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_APP_FIREBASE_USE_EMULATOR: "true"
      # localhost works when the browser runs on the host. Cypress runs inside a
      # container, where localhost is itself, so the testing profile overrides
      # this with EMULATOR_HOST=emulators.
      VITE_APP_EMULATOR_HOST: ${EMULATOR_HOST:-localhost}
    depends_on:
      emulators:
        condition: service_healthy
    restart: on-failure

  cypress:
    image: cypress/included:13.6.0
    working_dir: /e2e
    volumes:
      - .:/e2e
    environment:
      CYPRESS_BASE_URL: http://app:5173
    depends_on:
      app:
        condition: service_started
    profiles:
      - testing
