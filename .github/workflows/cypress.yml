name: Cypress End-to-End Tests

on: pull_request

permissions:
  contents: read

jobs:
  cypress-tests:
    name: Run Cypress Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22]

    env:
      CI: false
      VITE_APP_FIREBASE_USE_EMULATOR: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Register Log Masks
        run: |
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_API_KEY }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_AUTH_DOMAIN }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_DATABASE_URL }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_PROJECT_ID }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_STORAGE_BUCKET }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_MESSAGING_SENDER_ID }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_APP_ID }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_MEASUREMENTID }}"
          echo "::add-mask::${{ vars.VITE_APP_FIREBASE_FCM_VAPID_KEY }}"
          echo "::add-mask::${{ vars.CYPRESS_PROJECT_ID }}"

      # Forked pull_request workflows cannot access repository variables or secrets,
      # so public Firebase configuration is provided as a fallback to allow CI to run
      # for external contributors.
      # TODO: Remove the fallback values if GitHub adds support for repository
      # variables in pull_request workflows for pull requests from forked repositories.
      - name: Create .env
        run: |
          cat > .env <<EOF
          VITE_APP_FIREBASE_USE_EMULATOR=true
          VITE_APP_FIREBASE_API_KEY=${{ vars.VITE_APP_FIREBASE_API_KEY || 'AIzaSyASOtRR71J484CcXhvs3BBZByhIII8lNuU' }}
          VITE_APP_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_APP_FIREBASE_AUTH_DOMAIN || 'codelabz-966e5.firebaseapp.com' }}
          VITE_APP_FIREBASE_DATABASE_URL=${{ vars.VITE_APP_FIREBASE_DATABASE_URL || 'https://codelabz-966e5-default-rtdb.asia-southeast1.firebasedatabase.app' }}
          VITE_APP_FIREBASE_PROJECT_ID=${{ vars.VITE_APP_FIREBASE_PROJECT_ID || 'codelabz-966e5' }}
          VITE_APP_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_APP_FIREBASE_STORAGE_BUCKET || 'codelabz-966e5.appspot.com' }}
          VITE_APP_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_APP_FIREBASE_MESSAGING_SENDER_ID || '1004651538159' }}
          VITE_APP_FIREBASE_APP_ID=${{ vars.VITE_APP_FIREBASE_APP_ID || '1:1004651538159:web:9801af1b5c45c01aec9d1a' }}
          VITE_APP_FIREBASE_MEASUREMENTID=${{ vars.VITE_APP_FIREBASE_MEASUREMENTID || 'G-N0P8Q281YB' }}
          VITE_APP_FIREBASE_FCM_VAPID_KEY=${{ vars.VITE_APP_FIREBASE_FCM_VAPID_KEY || 'BBcdjIEOfdgGVCbK2-vpE_aDfNlJr5ffQ6UegCzH-QjMhpuEpCs6Zw7o1DFm9cYGCDF7ri0W4YwsyubL7owjhIQ' }}
          CYPRESS_PROJECT_ID=${{ vars.CYPRESS_PROJECT_ID || 'gjfouu' }}
          EOF

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install Functions Dependencies
        run: npm install --legacy-peer-deps
        working-directory: functions

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firebase Emulators
        run: |
          firebase emulators:start \
            --import=./testdata \
            --project "${{ vars.VITE_APP_FIREBASE_PROJECT_ID || 'codelabz-966e5' }}" &
          sleep 15

      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config-file: cypress.config.js
          install-command: npm install --legacy-peer-deps
          build: npm run build
          start: npm run dev
          wait-on: "http://localhost:5173"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_PROJECT_ID: ${{ vars.CYPRESS_PROJECT_ID || 'gjfouu' }}
          COMMIT_INFO_BRANCH: ${{ github.ref_name }}
