name: Deploy to Firebase Hosting Preview Channel on PR

on:
  pull_request_target:
    types:
      - labeled
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'safe-to-deploy-preview')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CODELABZ }}
          projectId: ${{ vars.VITE_APP_FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 30d
          # Pinned to 13.35.1 as it is the last version that supports Node 18.
          firebaseToolsVersion: 13.35.1

      - name: Remove safe-to-deploy-preview label
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'safe-to-deploy-preview'
            }).catch((e) => {
              core.info(`Label removal failed: ${e.message}`);
            });
